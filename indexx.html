  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

.7)\">Пробное занятие за 500 ₽<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 36px; max-width: 560px\">\n<div style=\"padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.1)\"><p style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 24px\">[12] лет<\u002Fp><p style=\"margin: 2px 0 0; font-size: 14px; color: #DCFCE7\">работаем с детьми<\u002Fp><\u002Fdiv>\n<div style=\"padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.1)\"><p style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 24px\">[850+]<\u002Fp><p style=\"margin: 2px 0 0; font-size: 14px; color: #DCFCE7\">учеников прошли школу<\u002Fp><\u002Fdiv>\n<div style=\"padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.1)\"><p style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 24px\">100%<\u002Fp><p style=\"margin: 2px 0 0; font-size: 14px; color: #DCFCE7\">тренеров с лицензией<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 400px; min-width: 0; position: relative\">\n<div role=\"img\" aria-label=\"Место для фото: дети на тренировке по футболу\" style=\"aspect-ratio: 4 / 3; border-radius: 24px; border: 2px dashed rgba(255,255,255,0.45); background: repeating-linear-gradient(135deg, rgba(255,255,255,0.06) 0 18px, rgba(255,255,255,0.12) 18px 36px); display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #DCFCE7; font-weight: 700\">[Фото: дети на тренировке, 1200×900, WebP]<\u002Fdiv>\n<div style=\"position: absolute; left: -12px; bottom: -18px; background: #FFFFFF; color: #0F172A; border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 14px 30px rgba(15,23,42,0.2)\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2563EB\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-weight: 800; font-size: 15px\">Группы до 12 человек<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- КВИЗ -->\n<section id=\"quiz\" style=\"padding: 64px 20px 72px\">\n<div style=\"max-width: 820px; margin: 0 auto\">\n<p style=\"margin: 0; text-align: center; color: #15803D; font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase\">Подбор за 30 секунд<\u002Fp>\n<h2 style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.15; text-align: center; margin: 10px 0 28px\">Какой абонемент подойдёт вашему ребёнку?<\u002Fh2>\n<div style=\"border-radius: 24px; border: 1px solid #E2E8F0; background: #FFFFFF; box-shadow: 0 16px 40px rgba(22,163,74,0.1); padding: clamp(20px, 4vw, 36px)\">\n<sc-if value=\"{{quizShowQ}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px\">\n<span style=\"font-weight: 700; color: #475569; font-size: 15px\">Вопрос {{quizNum}} из 3<\u002Fspan>\n<sc-if value=\"{{quizCanBack}}\" hint-placeholder-val=\"{{ false }}\">\n<button class=\"btn btn-l\" type=\"button\" sc-camel-on-click=\"{{quizBack}}\" style=\"min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid #CBD5E1; background: #FFFFFF; font: inherit; font-weight: 700; color: #0F172A\">Назад<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"height: 8px; border-radius: 99px; background: #E2E8F0; overflow: hidden\"><div style=\"{{quizBarStyle}}\"><\u002Fdiv><\u002Fdiv>\n<h3 style=\"font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 22px; margin: 24px 0 16px\">{{quizTitle}}<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px\">\n<sc-for list=\"{{quizOptions}}\" as=\"o\" hint-placeholder-count=\"3\">\n<button class=\"btn btn-l\" type=\"button\" sc-camel-on-click=\"{{o.pick}}\" style=\"min-height: 72px; padding: 16px; border-radius: 16px; border: 1.5px solid #CBD5E1; background: #FFFFFF; text-align: left; font: inherit; color: #0F172A; display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-weight: 800; font-size: 18px\">{{o.label}}<\u002Fspan>\n<span style=\"font-size: 14px; color: #475569\">{{o.sub}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{quizShowRes}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; align-items: center; gap: 10px; color: #15803D; font-weight: 800\">\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15803D\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\nГотово! Рекомендуем для группы {{ageLabel}}<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; margin-top: 18px\">\n<sc-for list=\"{{recs}}\" as=\"r\" hint-placeholder-count=\"1\">\n<div style=\"border-radius: 20px; border: 2px solid #2563EB; padding: 20px; background: #EFF6FF; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-size: 13px; font-weight: 800; color: #1D4ED8; text-transform: uppercase; letter-spacing: 0.06em\">{{r.tag}}<\u002Fspan>\n<span style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 20px\">{{r.name}}<\u002Fspan>\n<span style=\"color: #475569\">{{r.lessons}}<\u002Fspan>\n<span style=\"font-weight: 800; font-size: 26px; margin-top: 4px\">{{r.priceText}}<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px\">\n<button class=\"btn btn-o\" type=\"button\" sc-camel-on-click=\"{{r.buy}}\" style=\"min-height: 48px; padding: 12px 22px; border-radius: 14px; border: none; background: #F97316; color: #0F172A; font: inherit; font-weight: 800\">Купить<\u002Fbutton>\n<button class=\"btn btn-l\" type=\"button\" sc-camel-on-click=\"{{r.show}}\" style=\"min-height: 48px; padding: 12px 18px; border-radius: 14px; border: 1.5px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font: inherit; font-weight: 700\">Смотреть в каталоге<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{quizReset}}\" style=\"margin-top: 16px; min-height: 44px; padding: 8px 0; border: none; background: none; color: #15803D; font: inherit; font-weight: 800; text-decoration: underline\">Пройти подбор заново<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- АБОНЕМЕНТЫ -->\n<section id=\"plans\" style=\"padding: 24px 20px 88px\">\n<div style=\"max-width: 1200px; margin: 0 auto\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 28px\">\n<div style=\"min-width: 0\">\n<p style=\"margin: 0; color: #15803D; font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase\">Абонементы<\u002Fp>\n<h2 style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.15; margin: 10px 0 0\">Понятные цены без доплат<\u002Fh2>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Возрастная группа\" style=\"display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-radius: 16px; background: #F1F5F9\">\n<sc-for list=\"{{ages}}\" as=\"a\" hint-placeholder-count=\"3\">\n<button class=\"btn\" type=\"button\" aria-pressed=\"{{a.pressed}}\" sc-camel-on-click=\"{{a.pick}}\" style=\"{{a.style}}\">{{a.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 24px\">\n<sc-for list=\"{{plans}}\" as=\"p\" hint-placeholder-count=\"6\">\n<article id=\"{{p.anchor}}\" class=\"card\" style=\"{{p.cardStyle}}\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 30px\">\n<span style=\"font-size: 14px; font-weight: 700; color: #475569\">Группа {{p.group}}<\u002Fspan>\n<sc-if value=\"{{p.badge}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{p.badgeStyle}}\">{{p.badge}}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<h3 style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 22px; margin: 12px 0 4px\">{{p.name}}<\u002Fh3>\n<p style=\"margin: 0; color: #475569; font-size: 15px\">{{p.lessons}} · {{p.term}}<\u002Fp>\n<div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; margin-top: 18px\">\n<span style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 34px; line-height: 1\">{{p.priceText}}<\u002Fspan>\n<sc-if value=\"{{p.oldText}}\" hint-placeholder-val=\"{{ false }}\"><s style=\"color: #475569; font-size: 17px; font-weight: 600\">{{p.oldText}}<\u002Fs><\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{p.perText}}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin: 6px 0 0; color: #15803D; font-weight: 700; font-size: 15px\">{{p.perText}}<\u002Fp><\u002Fsc-if>\n<sc-if value=\"{{p.isRec}}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin: 10px 0 0; display: inline-flex; padding: 4px 10px; border-radius: 8px; background: #DBEAFE; color: #1D4ED8; font-weight: 800; font-size: 13px; align-self: flex-start\">Рекомендуем по итогам подбора<\u002Fp><\u002Fsc-if>\n<ul style=\"list-style: none; padding: 0; margin: 20px 0 24px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1\">\n<sc-for list=\"{{p.features}}\" as=\"f\" hint-placeholder-count=\"3\">\n<li style=\"display: flex; gap: 10px; align-items: flex-start\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16A34A\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 2px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n<span>{{f}}<\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<button class=\"btn btn-o\" type=\"button\" sc-camel-on-click=\"{{p.buy}}\" style=\"min-height: 52px; width: 100%; border-radius: 16px; border: none; background: #F97316; color: #0F172A; font: inherit; font-weight: 800; font-size: 17px\">Купить<\u002Fbutton>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ПОЧЕМУ МЫ -->\n<section id=\"why\" style=\"background: #F0FDF4; clip-path: polygon(0 56px, 100% 0, 100% calc(100% - 56px), 0 100%); padding: 120px 20px 128px\">\n<div style=\"max-width: 1200px; margin: 0 auto\">\n<p style=\"margin: 0; color: #15803D; font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase\">Почему мы<\u002Fp>\n<h2 style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.15; margin: 10px 0 32px; max-width: 720px\">Спокойно за ребёнка — с первой тренировки<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 20px\">\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 24px; box-shadow: 0 8px 24px rgba(22,163,74,0.08); display: flex; gap: 16px\">\n<span style=\"width: 52px; height: 52px; border-radius: 16px; background: #DCFCE7; display: flex; align-items: center; justify-content: center; flex: none\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15803D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"6\"><\u002Fcircle><path d=\"M15.5 12.9 17 22l-5-3-5 3 1.5-9.1\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div><h3 style=\"margin: 0 0 4px; font-size: 18px; font-weight: 800\">Тренеры с лицензией<\u002Fh3><p style=\"margin: 0; color: #475569\">Лицензии UEFA C и B, педагогическое образование, проверка справок о несудимости.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 24px; box-shadow: 0 8px 24px rgba(22,163,74,0.08); display: flex; gap: 16px\">\n<span style=\"width: 52px; height: 52px; border-radius: 16px; background: #DBEAFE; display: flex; align-items: center; justify-content: center; flex: none\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1D4ED8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div><h3 style=\"margin: 0 0 4px; font-size: 18px; font-weight: 800\">Группы до 12 человек<\u002Fh3><p style=\"margin: 0; color: #475569\">Тренер видит каждого ребёнка и даёт обратную связь на каждом занятии.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 24px; box-shadow: 0 8px 24px rgba(22,163,74,0.08); display: flex; gap: 16px\">\n<span style=\"width: 52px; height: 52px; border-radius: 16px; background: #DCFCE7; display: flex; align-items: center; justify-content: center; flex: none\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15803D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div><h3 style=\"margin: 0 0 4px; font-size: 18px; font-weight: 800\">Страховка включена<\u002Fh3><p style=\"margin: 0; color: #475569\" yle=\"min-height: 52px; padding: 0 18px; border-radius: 16px; border: 1.5px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font: inherit; font-weight: 700\">Назад<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{isStep1or2}}\" hint-placeholder-val=\"{{ true }}\">\n<button class=\"btn btn-o\" type=\"button\" sc-camel-on-click=\"{{next}}\" style=\"flex: 1; min-height: 52px; border-radius: 16px; border: none; background: #F97316; color: #0F172A; font: inherit; font-weight: 800; font-size: 17px\">Далее · {{totalText}}<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{isStep3}}\" hint-placeholder-val=\"{{ false }}\">\n<button class=\"btn btn-o\" type=\"button\" sc-camel-on-click=\"{{pay}}\" disabled=\"{{loading}}\" aria-busy=\"{{loadingStr}}\" style=\"{{payBtnStyle}}\">\n<sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"spin\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0F172A\" stroke-width=\"2.6\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M21 12a9 9 0 1 1-6.2-8.6\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n{{payLabel}}<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{isFail}}\" hint-placeholder-val=\"{{ false }}\">\n<button class=\"btn btn-o\" type=\"button\" sc-camel-on-click=\"{{retry}}\" style=\"flex: 1; min-height: 52px; border-radius: 16px; border: none; background: #F97316; color: #0F172A; font: inherit; font-weight: 800; font-size: 17px\">Попробовать снова<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ОКНО ДОКУМЕНТА -->\n<sc-if value=\"{{docShown}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"ov\" sc-camel-on-click=\"{{closeDoc}}\" sc-camel-on-key-down=\"{{docKey}}\" style=\"position: fixed; inset: 0; z-index: 70; background: rgba(15,23,42,0.6); display: flex; align-items: center; justify-content: center; padding: 16px\">\n<div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"doc-title\" sc-camel-on price: 9900, old: 0, per: 825, badge: '', features: ['3 тренировки в неделю', 'Форма в подарок', 'Видеоразбор игр раз в месяц', 'Отработка 2 пропусков'] },\n  { id: 'indiv', name: 'Индивидуальная тренировка', lessons: '1 занятие 60 минут', term: 'время по согласованию', price: 2500, old: 0, per: 0, badge: '', features: ['Персональный тренер', 'Программа под цели ребёнка', 'Любой удобный день'] },\n  { id: 'q3', name: '3 месяца', lessons: '24 занятия, 2 в неделю', term: 'срок 90 дней', price: 19440, old: 21600, per: 810, badge: 'Выгодно', features: ['Скидка 10% к трём месяцам «Стандарт»', 'Форма в подарок', 'Заморозка до 14 дней', 'Фото- и видеоотчёты'] }\n];\nconst AGES = [{ key: '8-10', label: '8–10 лет' }, { key: '11-13', label: '11–13 лет' }, { key: '14-17', label: '14–17 лет' }];\nconst QUIZ = [\n  { key: 'age', title: 'Сколько лет ребёнку?', opts: [{ v: '8-10', label: '8–10 лет', sub: 'Младшая группа' }, { v: '11-13', label: '11–13 лет', sub: 'Средняя группа' }, { v: '14-17', label: '14–17 лет', sub: 'Старшая группа' }] },\n  { key: 'level', title: 'Есть ли опыт в футболе?', opts: [{ v: 'new', label: 'Новичок', sub: 'Ещё не занимался' }, { v: 'some', label: 'Немного', sub: 'Занимался до года' }, { v: 'adv', label: 'Продвинутый', sub: 'Играет больше года' }] },\n  { key: 'freq', title: 'Сколько тренировок в неделю удобно?', opts: [{ v: '1', label: '1 раз', sub: 'Попробовать и втянуться' }, { v: '2', label: '2 раза', sub: 'Оптимально для прогресса' }, { v: '3', label: '3 раза', sub: 'Серьёзная подготовка' }] }\n];\nconst FAQS = [\n  { q: 'Можно ли заморозить абонемент при болезни?', a: 'Да. По справке от врача заморозим абонемент до 14 дней — пропущенные занятия перенесутся.' },\n  { q: 'Как вернуть деньги за абонемент?', a: 'Стоимость неиспользованных занятий возвращаем по заявлению в течение 10 рабочих дней на ту же карту. Подробности — в условиях возврата.' },\n  { q: 'Что взять на тренировку?', a: 'Спортивную форму по погоде, бутсы или кроссовки, щитки и бутылку воды. Мячи и манишки даёт школа.' },\n  { q: 'Можно ли отработать пропуск?', a: 'Да, в любой группе того же возраста в течение срока абонемента: в «Стандарте» — 1 отработка, в «Профи» — 2.' },\n  { q: 'Как проходит пробное занятие?', a: 'Ребёнок занимается 60 минут вместе с группой своего возраста, а тренер после занятия расскажет об уровне и посоветует абонемент.' },\n  { q: 'Дети застрахованы?', a: 'Да, все ученики застрахованы на время тренировок и матчей. Полис уже входит в стоимость абонемента.' }\n];\nconst DOCS = {\n  offer: { title: 'Публичная оферта', text: '[Вставьте текст договора-оферты на оказание услуг по проведению тренировок: стороны, предмет договора, порядок оплаты, заморозка и перенос занятий, ответственность сторон, реквизиты.]' },\n  privacy: { title: 'Политика конфиденциальности', text: '[Вставьте политику обработки персональных данных по 152-ФЗ: какие данные собираем (ФИО, телефон, email, данные ребёнка), цели, сроки хранения, передача платёжному провайдеру, контакты оператора.]' },\n  refund: { title: 'Условия возврата', text: '[Вставьте условия возврата: возврат стоимости неиспользованных занятий по заявлению, срок 10 рабочих дней, способ возврата — на карту оплаты, удержания при наличии.]' }\n};\nconst fmt = (n) => n.toLocaleString('ru-RU') + ' ₽';\nfunction maskPhone(v) {\n  let d = String(v).replace(/\\D/g, '');\n  if (d[0] === '7' || d[0] === '8') d = d.slice(1);\n  d = d.slice(0, 10);\n  if (!d.length) return '';\n  let r = '+7 (' + d.slice(0, 3);\n  if (d.length > 3) r += ') ' + d.slice(3, 6);\n  if (d.length > 6) r += '-' + d.slice(6, 8);\n  if (d.length > 8) r += '-' + d.slice(8, 10);\n  return r;\n}\nfunction isoToday() { const n = new Date(); n.setMinutes(n.getMinutes() - n.getTimezoneOffset()); return n.toISOString().slice(0, 10); }\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      age: '8-10', quizStep: 0, quiz: {}, recId: null, recAlt: null,\n      modal: false, step: 1, planId: 'standard', promo: '', promoApplied: false, promoMsg: '', promoOk: false,\n      form: { parentName: '', phone: '', email: '', childName: '', childBirth: '', branch: '', startDate: '', consent: false },\n      touched: {}, tried2: false, pay: 'card', demoOutcome: 'success', loading: false, result: null, orderNo: '',\n      faq: 0, menu: false, doc: null\n    };\n  }\n  componentDidMount() {\n    try {\n      const q = new URLSearchParams(window.location.search).get('payment');\n      if (q === 'success' || q === 'fail') this.setState({ modal: true, result: q, orderNo: q === 'success' ? this.newOrderNo() : '' });\n    } catch (e) {}\n  }\n  newOrderNo() { return 'FS-' + String(100000 + Math.floor(Math.random() * 900000)); }\n  reduced() { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }\n  scrollTo(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: this.reduced() ? 'auto' : 'smooth', block: 'center' }); }\n  openCheckout(id) { this.setState({ modal: true, step: 1, planId: id, result: null, menu: false }); }\n  validate(f) {\n    const e = {};\n    if (f.parentName.trim().split(/\\s+/).filter(Boolean).length < 2) e.parentName = 'укажите фамилию и имя';\n    if (f.phone.replace(/\\D/g, '').length !== 11) e.phone = 'введите номер полностью, 10 цифр после +7';\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(f.email.trim())) e.email = 'проверьте адрес — на него придёт чек';\n    if (!f.childName.trim()) e.childName = 'укажите имя ребёнка';\n    if (!f.childBirth) e.childBirth = 'укажите дату рождения';\n    else {\n      const b = new Date(f.childBirth), n = new Date();\n      let a = n.getFullYear() - b.getFullYear();\n      const m = n.getMonth() - b.getMonth();\n      if (m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;\n      if (isNaN(a) || a < 8 || a > 17) e.childBirth = 'мы набираем детей от 8 до 17 лет';\n    }\n    if (!f.branch) e.branch = 'выберите площадку';\n    if (!f.startDate) e.startDate = 'выберите дату';\n    else if (f.startDate < isoToday()) e.startDate = 'дата не может быть в прошлом';\n    if (!f.consent) e.consent = 'без согласия мы не сможем оформить заказ';\n    return e;\n  }\n  addToCal() {\n    const s = this.state, f = s.form;\n    const d = (f.startDate || isoToday()).replace(/-/g, '');\n    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//football-school//RU', 'BEGIN:VEVENT', 'UID:' + (s.orderNo || 'order') + '@school', 'DTSTAMP:' + d + 'T090000', 'DTSTART:' + d + 'T170000', 'DTEND:' + d + 'T180000', 'SUMMARY:Первая тренировка по футболу', 'LOCATION:' + (f.branch || 'Площадка школы'), 'DESCRIPTION:Заказ ' + s.orderNo + '. Возьмите форму, щитки и воду.', 'END:VEVENT', 'END:VCALENDAR'].join('\\r\\n');\n    try {\n      const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));\n      const a = document.createElement('a'); a.href = url; a.download = 'pervaya-trenirovka.ics'; a.click();\n      setTimeout(() => URL.revokeObjectURL(url), 1500);\n    } catch (e) {}\n  }\n  renderVals() {\n    const s = this.state;\n    const ageLabel = (AGES.find((a) => a.key === s.age) || AGES[0]).label;\n    const recIds = [s.recId, s.recAlt].filter(Boolean);\n\n    const plans = PLANS.map((p) => {\n      const isRec = recIds.indexOf(p.id) !== -1;\n      const badgeStyle = p.badge === 'Хит' ? 'padding: 5px 12px; border-radius: 999px; background: #F97316; color: #0F172A; font-weight: 800; font-size: 13px'\n        : p.badge === 'Выгодно' ? 'padding: 5px 12px; border-radius: 999px; background: #2563EB; color: #FFFFFF; font-weight: 800; font-size: 13px'\n        : 'padding: 5px 12px; border-radius: 999px; background: #DCFCE7; color: #166534; font-weight: 800; font-size: 13px';\n      return {\n        ...p, anchor: 'plan-' + p.id, group: ageLabel, isRec,\n        priceText: fmt(p.price), oldText: p.old ? fmt(p.old) : '', perText: p.per ? fmt(p.per) + ' за занятие' : '',\n        badgeStyle,\n        cardStyle: 'display: flex; flex-direction: column; border-radius: 24px; padding: 24px; background: #FFFFFF; border: ' + (isRec ? '2.5px solid #2563EB; box-shadow: 0 0 0 6px #DBEAFE, 0 16px 36px rgba(37,99,235,0.18)' : (p.badge === 'Хит' ? '2px solid #F97316; box-shadow: 0 14px 34px rgba(249,115,22,0.16)' : '1px solid #E2E8F0; box-shadow: 0 10px 28px rgba(22,163,74,0.08)')),\n        buy: () => this.openCheckout(p.id)\n      };\n    });\n\n    const ages = AGES.map((a) => ({\n      label: a.label, pressed: s.age === a.key ? 'true' : 'false',\n      style: 'min-height: 44px; padding: 8px 16px; border-radius: 12px; border: none; font: inherit; font-weight: 800; ' + (s.age === a.key ? 'background: #16A34A; color: #FFFFFF; box-shadow: 0 6px 14px rgba(22,163,74,0.3)' : 'background: transparent; color: #0F172A'),\n      pick: () => this.setState({ age: a.key })\n    }));\n\n    // Квиз\n    const qs = Math.min(s.quizStep, 2);\n    const Q = QUIZ[qs];\n    const quizOptions = Q.opts.map((o) => ({\n      label: o.label, sub: o.sub,\n      pick: () => {\n        const quiz = { ...this.state.quiz, [Q.key]: o.v };\n        if (qs < 2) { this.setState({ quiz, quizStep: qs + 1 }); return; }\n        const recId = quiz.freq === '1' ? 'start' : quiz.freq === '3' ? 'pro' : 'standard';\n        const recAlt = quiz.level === 'new' ? 'trial' : (quiz.freq === '2' ? 'q3' : null);\n        this.setState({ quiz, quizStep: 3, recId, recAlt, age: quiz.age || this.state.age });\n      }\n    }));\n    const recs = recIds.map((id, i) => {\n      const p = PLANS.find((x) => x.id === id);\n      return {\n        tag: i === 0 ? 'Основная рекомендация' : (id === 'trial' ? 'Чтобы начать' : 'Выгоднее на 10%'),\n        name: p.name, lessons: p.lessons, priceText: fmt(p.price),\n        buy: () => this.openCheckout(id), show: () => this.scrollTo('plan-' + id)\n      };\n    });\n\n    const faqs = FAQS.map((f, i) => ({\n      q: f.q, a: f.a, open: s.faq === i, expanded: s.faq === i ? 'true' : 'false',\n      chevStyle: 'flex: none; transition: transform .2s ease; transform: rotate(' + (s.faq === i ? 180 : 0) + 'deg)',\n      toggle: () => this.setState({ faq: this.state.faq === i ? -1 : i })\n    }));\n\n    // Оформление\n    const sel0 = PLANS.find((p) => p.id === s.planId) || PLANS[2];\n    const discount = s.promoApplied ? Math.round(sel0.price * 0.1) : 0;\n    const total = sel0.price - discount;\n    const errs = this.validate(s.form);\n    const keys = ['parentName', 'phone', 'email', 'childName', 'childBirth', 'branch', 'startDate', 'consent'];\n    const e = {}, inv = {}, is = {}, h = {};\n    keys.forEach((k) => {\n      const show = (s.touched[k] || s.tried2) && errs[k];\n      e[k] = show ? errs[k] : '';\n      inv[k] = show ? 'true' : 'false';\n      is[k] = 'width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 12px; font: inherit; font-size: 16px; color: #0F172A; background: #FFFFFF; border: ' + (show ? '2px solid #B91C1C' : '1.5px solid #CBD5E1');\n      h[k] = (ev) => {\n        let v = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value;\n        if (k === 'phone') v = maskPhone(v);\n        this.setState((st) => ({ form: { ...st.form, [k]: v }, touched: { ...st.touched, [k]: true } }));\n      };\n    });\n\n    const planOpts = PLANS.map((p) => ({\n      name: p.name, priceText: fmt(p.price), checked: p.id === s.planId,\n      style: 'display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; border-radius: 14px; cursor: pointer; border: ' + (p.id === s.planId ? '2px solid #16A34A; background: #F0FDF4' : '1.5px solid #E2E8F0; background: #FFFFFF'),\n      pick: () => this.setState({ planId: p.id })\n    }));\n    const PAY = [{ k: 'card', label: 'Банковская карта', sub: 'МИР, Visa, Mastercard' }, { k: 'sbp', label: 'СБП', sub: 'Оплата по QR-коду через приложение банка' }, { k: 'sber', label: 'SberPay', sub: 'В приложении СберБанк Онлайн' }];\n    const payOpts = PAY.map((m) => ({\n      label: m.label, sub: m.sub, checked: s.pay === m.k,\n      style: 'display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 14px; cursor: pointer; border: ' + (s.pay === m.k ? '2px solid #16A34A; background: #F0FDF4' : '1.5px solid #E2E8F0; background: #FFFFFF'),\n      pick: () => this.setState({ pay: m.k })\n    }));\n    const stepNames = ['Абонемент', 'Данные', 'Оплата'];\n    const stepsUI = stepNames.map((n, i) => ({\n      current: s.step === i + 1 ? 'step' : 'false',\n      barStyle: 'height: 6px; border-radius: 99px; background: ' + (i + 1 < s.step ? '#16A34A' : i + 1 === s.step ? '#F97316' : '#E2E8F0')\n    }));\n    const pill = (on) => 'min-height: 36px; padding: 4px 12px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 800; border: 1.5px solid ' + (on ? '#0F172A; background: #0F172A; color: #FFFFFF' : '#CBD5E1; background: #FFFFFF; color: #0F172A');\n    const inResult = !!s.result;\n    const doc = s.doc ? DOCS[s.doc] : null;\n\n    return {\n      menu: s.menu, menuExpanded: s.menu ? 'true' : 'false',\n      toggleMenu: () => this.setState({ menu: !this.state.menu }),\n      closeMenu: () => this.setState({ menu: false }),\n      buyTrial: () => this.openCheckout('trial'),\n      ageLabel, ages, plans, faqs,\n\n      quizShowQ: s.quizStep < 3, quizShowRes: s.quizStep >= 3, quizNum: qs + 1, quizCanBack: s.quizStep > 0 && s.quizStep < 3,\n      quizTitle: Q.title, quizOptions, recs,\n      quizBarStyle: 'height: 100%; border-radius: 99px; background: #16A34A; transition: transform .25s ease; transform-origin: left; transform: scaleX(' + ((qs + 1) / 3) + ')',\n      quizBack: () => this.setState({ quizStep: Math.max(0, this.state.quizStep - 1) }),\n      quizReset: () => this.setState({ quizStep: 0, quiz: {}, recId: null, recAlt: null }),\n\n      modal: s.modal, step: s.step, stepName: stepNames[s.step - 1], stepsUI,\n      showSteps: !inResult,\n      modalTitle: s.result === 'success' ? 'Заказ оформлен' : s.result === 'fail' ? 'Оплата' : 'Оформление абонемента',\n      isStep1: !inResult && s.step === 1, isStep2: !inResult && s.step === 2, isStep3: !inResult && s.step === 3,\n      isStep1or2: !inResult && s.step < 3,\n      isSuccess: s.result === 'success', isFail: s.result === 'fail',\n      showFooter: s.result !== 'success', canBack: !inResult && s.step > 1,\n      sel: { name: sel0.name, lessons: sel0.lessons, term: sel0.term, priceText: fmt(sel0.price) },\n      planOpts, payOpts,\n      promo: s.promo, promoMsg: s.promoMsg,\n      promoMsgStyle: 'margin: 6px 0 0; font-size: 14px; font-weight: 700; color: ' + (s.promoOk ? '#15803D' : '#B91C1C'),\n      setPromo: (ev) => this.setState({ promo: ev.target.value }),\n      applyPromo: () => {\n        const ok = this.state.promo.trim().toUpperCase() === 'START10';\n        this.setState({ promoApplied: ok, promoOk: ok, promoMsg: ok ? 'Промокод применён: скидка 10%' : 'Такого промокода нет — проверьте написание' });\n      },\n      hasDiscount: discount > 0, discountText: fmt(discount), totalText: fmt(total),\n      form: s.form, e, inv, is, h, today: isoToday(),\n      loading: s.loading, loadingStr: s.loading ? 'true' : 'false',\n      payLabel: s.loading ? 'Переходим к оплате…' : 'Оплатить ' + fmt(total),\n      payBtnStyle: 'flex: 1; min-height: 52px; border-radius: 16px; border: none; background: #F97316; color: #0F172A; font: inherit; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px; opacity: ' + (s.loading ? 0.75 : 1),\n      demoOkPressed: s.demoOutcome === 'success' ? 'true' : 'false', demoFailPressed: s.demoOutcome === 'fail' ? 'true' : 'false',\n      demoOkStyle: pill(s.demoOutcome === 'success'), demoFailStyle: pill(s.demoOutcome === 'fail'),\n      demoOk: () => this.setState({ demoOutcome: 'success' }),\n      demoFail: () => this.setState({ demoOutcome: 'fail' }),\n      orderNo: s.orderNo,\n      next: () => {\n        if (this.state.step === 1) { this.setState({ step: 2 }); return; }\n        const errsNow = this.validate(this.state.form);\n        if (Object.keys(errsNow).length) {\n          this.setState({ tried2: true });\n          const first = { parentName: 'f-parent', phone: 'f-phone', email: 'f-email', childName: 'f-child', childBirth: 'f-birth', branch: 'f-branch', startDate: 'f-start', consent: 'f-consent' }[Object.keys(errsNow)[0]];\n          setTimeout(() => { const el = document.getElementById(first); if (el) el.focus(); }, 0);\n          return;\n        }\n        this.setState({ step: 3 });\n      },\n      back: () => this.setState({ step: Math.max(1, this.state.step - 1) }),\n      pay: () => {\n        if (this.state.loading) return;\n        this.setState({ loading: true });\n        setTimeout(() => {\n          const ok = this.state.demoOutcome === 'success';\n          this.setState({ loading: false, result: ok ? 'success' : 'fail', orderNo: ok ? this.newOrderNo() : '' });\n        }, 1400);\n      },\n      retry: () => this.setState({ result: null, step: 3 }),\n      addToCal: () => this.addToCal(),\n      closeModal: () => {\n        if (this.state.loading) return;\n        const done = this.state.result === 'success';\n        this.setState(done ? { modal: false, result: null, step: 1, promo: '', promoApplied: false, promoMsg: '', tried2: false, touched: {} } : { modal: false, result: null });\n      },\n      modalKey: (ev) => { if (ev.key === 'Escape' && !this.state.loading) this.setState({ modal: false }); },\n      stop: (ev) => ev.stopPropagation(),\n\n      docShown: !!doc, docTitle: doc ? doc.title : '', docText: doc ? doc.text : '',\n      docOffer: () => this.setState({ doc: 'offer' }),\n      docPrivacy: () => this.setState({ doc: 'privacy' }),\n      docRefund: () => this.setState({ doc: 'refund' }),\n      closeDoc: () => this.setState({ doc: null }),\n      docKey: (ev) => { if (ev.key === 'Escape') this.setState({ doc: null }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
